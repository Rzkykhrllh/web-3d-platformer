<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Character Viewer</title>
<style>
  :root { --bg: #f2f2f0; --ink: #222; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #1d1d20; --ink: #eee; } }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  .bar { position: fixed; top: 12px; left: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
  .bar button { font: inherit; padding: 6px 12px; border-radius: 8px; border: 1px solid #8888; background: var(--bg); color: var(--ink); cursor: pointer; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="bar">
  <button data-view="front">Front</button>
  <button data-view="side">Side</button>
  <button data-view="back">Back</button>
  <button data-view="spin">Spin</button>
  <button data-anim="run">Run</button>
  <button data-anim="idle">Idle</button>
  <button data-char="cat">Cat</button>
  <button data-char="pip">Pip</button>
</div>
<script type="module" src="/src/character-viewer.js"></script>
</body>
</html>
