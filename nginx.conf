# The game lives under /island; every other URL on the domain goes there.
# Dokploy route: path "/" with Strip Path off, so nginx sees the full URL.
server {
    listen 80;
    root /usr/share/nginx/html;
    # Relative Location, so the redirect keeps https behind the proxy
    absolute_redirect off;

    location = /island {
        try_files /island/index.html =404;
    }

    location /island/ {
        try_files $uri $uri/index.html @home;
    }

    location / {
        return 302 /island;
    }

    location @home {
        return 302 /island;
    }
}
